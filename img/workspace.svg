<svg width="800" height="500" viewBox="0 0 800 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="500" fill="#0A0E0C"/>
  <defs>
    <radialGradient id="codeGlow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#00D68F" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0A0E0C" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="laptopGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#19241F"/>
      <stop offset="100%" stop-color="#0D1311"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#codeGlow)"/>

  <!-- Desk Line -->
  <line x1="0" y1="380" x2="800" y2="380" stroke="#16221C" stroke-width="2"/>

  <!-- Laptop Screen -->
  <g transform="translate(220, 80)">
    <!-- Screen Bezel -->
    <rect width="360" height="240" rx="12" fill="#111815" stroke="#25352E" stroke-width="2"/>
    <!-- Screen Display / VS Code -->
    <rect x="10" y="10" width="340" height="220" rx="6" fill="#070A09"/>
    <!-- VS Code Top Bar -->
    <rect x="10" y="10" width="340" height="24" rx="4" fill="#0E1412"/>
    <circle cx="25" cy="22" r="4" fill="#EF4444" opacity="0.8"/>
    <circle cx="37" cy="22" r="4" fill="#F59E0B" opacity="0.8"/>
    <circle cx="49" cy="22" r="4" fill="#10B981" opacity="0.8"/>
    <text x="70" y="26" fill="#6B7280" font-family="monospace" font-size="10">App.tsx — Arya Portfolio</text>
    
    <!-- Code Lines simulation -->
    <g transform="translate(25, 45)" opacity="0.85">
      <rect x="0" y="0" width="60" height="6" rx="3" fill="#00D68F"/>
      <rect x="70" y="0" width="90" height="6" rx="3" fill="#60A5FA"/>
      
      <rect x="15" y="14" width="80" height="6" rx="3" fill="#F472B6"/>
      <rect x="105" y="14" width="120" height="6" rx="3" fill="#E2E8F0"/>
      
      <rect x="15" y="28" width="110" height="6" rx="3" fill="#00D68F"/>
      <rect x="135" y="28" width="50" height="6" rx="3" fill="#FBBF24"/>
      
      <rect x="30" y="42" width="140" height="6" rx="3" fill="#93C5FD"/>
      <rect x="30" y="56" width="90" height="6" rx="3" fill="#34D399"/>
      <rect x="30" y="70" width="160" height="6" rx="3" fill="#CBD5E1"/>

      <rect x="15" y="88" width="70" height="6" rx="3" fill="#F472B6"/>
      <rect x="0" y="104" width="40" height="6" rx="3" fill="#00D68F"/>
    </g>

    <!-- Laptop Base / Keyboard deck -->
    <path d="M-40 240 L400 240 L370 265 L-10 265 Z" fill="url(#laptopGrad)" stroke="#223029" stroke-width="1.5"/>
    <!-- Trackpad -->
    <rect x="140" y="246" width="80" height="12" rx="3" fill="#0B100E" stroke="#1C2722"/>
  </g>

  <!-- Headphones on Desk -->
  <g transform="translate(620, 290)">
    <path d="M20 70 A 45 45 0 0 1 100 70" fill="none" stroke="#25352E" stroke-width="8" stroke-linecap="round"/>
    <rect x="10" y="60" width="22" height="40" rx="8" fill="#121A16" stroke="#00D68F" stroke-width="1.5"/>
    <rect x="88" y="60" width="22" height="40" rx="8" fill="#121A16" stroke="#00D68F" stroke-width="1.5"/>
  </g>

  <!-- Desk Plant -->
  <g transform="translate(100, 270)">
    <path d="M30 60 L70 60 L60 110 L40 110 Z" fill="#18231E" stroke="#273830" stroke-width="1.5"/>
    <ellipse cx="50" cy="40" rx="14" ry="25" fill="#00D68F" opacity="0.8"/>
    <ellipse cx="35" cy="50" rx="12" ry="20" fill="#059669" transform="rotate(-25 35 50)"/>
    <ellipse cx="65" cy="50" rx="12" ry="20" fill="#10B981" transform="rotate(25 65 50)"/>
  </g>
</svg>
